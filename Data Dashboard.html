<!DOCTYPE html>
<html>
<head>
  <title>HTML Data Dashboard</title>
</head>
<body>
  <header>
    <h1>Data Dashboard</h1>
  </header>

  <section>
    <h2>Statistics Table</h2>
    <table border="1">
      <caption>User Statistics</caption>
      <tr>
        <th>Name</th>
        <th>Score</th>
        <th>Level</th>
      </tr>
      <tr>
        <td>Puneeth</td>
        <td>85</td>
        <td>Intermediate</td>
      </tr>
      <tr>
        <td>Jash</td>
        <td>95</td>
        <td>Advanced</td>
      </tr>
    </table>
  </section>

  <section>
    <h2>Progress</h2>
    <label for="progress1">Project Completion:</label>
    <progress id="progress1" value="70" max="100">70%</progress>

    <h3>Health Meter</h3>
    <label for="meter1">Server Load:</label>
    <meter id="meter1" value="0.6">60%</meter>
  </section>

  <section>
    <h2>Figures and Definitions</h2>
    <figure>
      <img src="chart.jpg" alt="Chart" width="200">
      <figcaption>Monthly Growth Chart</figcaption>
    </figure>
    <dl>
      <dt>HTML</dt>
      <dd>HyperText Markup Language</dd>
      <dt>API</dt>
      <dd>Application Programming Interface</dd>
    </dl>
  </section>

  <footer>
    <p>Dashboard &copy; 2025</p>
  </footer>
</body>
</html>
